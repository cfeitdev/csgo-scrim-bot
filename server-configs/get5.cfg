// ============================================================================
// get5 0.6.0 plugin configuration
//
// Install to:  csgo/cfg/sourcemod/get5.cfg   (get5 calls AutoExecConfig(true,
// "get5"), so SourceMod execs this path automatically on plugin load).
//
// This is the PLUGIN config -- the per-match config (teams, map, players) is
// generated by the scrim bot and pushed with get5_loadmatch_url/get5_loadmatch.
// Do not hand-write match configs; the bot owns those.
//
// Delivery mode: get5_loadmatch_url requires the SteamWorks extension. Check
// with "sm exts list" -- if SteamWorks is not there, the URL will be refused
// and you must run the bot in file mode (GET5_CONFIG_DIR + GET5_CONFIG_PREFIX)
// instead of GET5_BASE_URL.
//
// Every cvar below is from the 0.6.0 source. Values marked [BOT] matter to the
// Discord bot integration -- read those before changing them.
// ============================================================================


// ---------------------------------------------------------------------------
// Team enforcement and access
// ---------------------------------------------------------------------------

// [BOT] REQUIRED. Forces players onto the team their Steam ID is listed under
// in the match config. This is what stops people picking their own side.
// The bot also sets this per match, but keep it on here as the safety net.
get5_check_auths "1"

// [BOT] MUST be 0 with this bot. At "1" get5 kicks everyone who connects
// while no match is loaded, and there are three windows where that bites:
//   1. The bot changes the map, then waits GET5_LOAD_DELAY (15s) before
//      loading the config -- anyone who connects in that gap gets kicked, and
//      the bot then waits forever for a player who cannot get back in.
//   2. get5_creatematch builds a match from connected players, so it can
//      never work: no match means no players means no match.
//   3. Between scrims nobody can warm up or test anything.
// Keep unwanted players out with sv_password (see /randompassword) instead --
// that is what the bot's Connect info button distributes.
get5_kick_when_no_match_loaded "0"

// Admins with the changemap flag are exempt from the kick above. Inert while
// get5_kick_when_no_match_loaded is 0; left on so the behaviour is sane if you
// ever turn kicking back on.
get5_kick_immunity "1"

// [BOT] Leave empty. The bot loads the match config; an autoload here would
// fight it on every server restart.
get5_autoload_config ""


// ---------------------------------------------------------------------------
// Going live
// ---------------------------------------------------------------------------

// [BOT] Seconds teams have to ready up before forfeiting. 0 = unlimited.
// Keep at 0: the bot watches for all 10 players and fires get5_forceready
// itself, and its own GET5_READY_TIMEOUT is the real deadline.
get5_time_to_start "0"

// Seconds of LIVE-LIVE-LIVE countdown once both teams are ready.
get5_live_countdown_time "10"

// Seconds a team has to !stay or !swap after winning the knife round.
// The bot's match config uses side_type "standard", so there IS a knife round.
get5_time_to_make_knife_decision "60"

// Config files exec'd at each phase. These ship with get5 in cfg/get5/.
// Put your match rules (mp_maxrounds, mp_overtime_*, mp_startmoney) in live.cfg.
get5_warmup_cfg "get5/warmup.cfg"
get5_live_cfg "get5/live.cfg"

// [BOT] Leave at 0. If the server empties mid-match get5 would end it with no
// winner, which the bot's result watcher would read as a 0-0 draw and apply
// Elo for. At 0 an abandoned match sits until someone runs /game end, which
// is the safer default for a rated ladder.
get5_end_match_on_empty_server "0"


// ---------------------------------------------------------------------------
// Veto
// ---------------------------------------------------------------------------
// [BOT] Both are inert with the Discord bot: the veto happens in Discord and
// the match config sets skip_veto true. They only apply if you run a match
// created on the server with get5_creatematch.

get5_veto_countdown "5"
get5_veto_confirmation_time "2.0"


// ---------------------------------------------------------------------------
// Pausing
// ---------------------------------------------------------------------------

get5_pausing_enabled "1"

// Pauses per team per half. 0 = unlimited. 2 is a reasonable pug limit.
get5_max_pauses "2"

// Total seconds a team may spend paused. 0 = unlimited.
get5_max_pause_time "300"

// If non-zero, every pause is exactly this many seconds and cannot be
// unpaused early. 0 = teams unpause when ready.
get5_fixed_pause_time "0"

get5_reset_pauses_each_half "1"

// Technical pauses (uncapped, for genuine problems).
get5_allow_technical_pause "1"


// ---------------------------------------------------------------------------
// Backups and !stop
// ---------------------------------------------------------------------------

// Round backups let you restore after a crash or a bad round. Keep these on.
get5_backup_system_enabled "1"

// Lets players call !stop to restore the last round (needs both teams to agree).
get5_stop_command_enabled "1"

// Seconds before a backup file is deleted. 160000 is ~44 hours. 0 = never.
get5_max_backup_age "160000"


// ---------------------------------------------------------------------------
// Demos, stats and logs
// ---------------------------------------------------------------------------

// Empty string disables demo recording. Keep demos -- they settle arguments.
get5_demo_name_format "{MATCHID}_map{MAPNUMBER}_{MAPNAME}"

// Where per-match stats are written. Empty disables.
get5_stats_path_format "get5_matchstats_{MATCHID}.cfg"

// Structured match event log. Empty disables. Turn this on if you ever want
// results read from disk rather than polled over RCON.
get5_event_log_format ""

// End-of-round damage reports in chat. Players like these.
get5_print_damage "1"
get5_damageprint_format "--> ({DMG_TO} dmg / {HITS_TO} hits) to ({DMG_FROM} dmg / {HITS_FROM} hits) from {NAME} ({HEALTH} HP)"


// ---------------------------------------------------------------------------
// Server identity
// ---------------------------------------------------------------------------

// Distinguishes temp/backup files if you run several get5 servers. Give each
// server a different number.
get5_server_id "1"

// Hostname while a match is live. Empty disables the rewrite.
// Tags: {MAPNUMBER} {MATCHID} {SERVERID} {MAPNAME} {TIME} {TEAM1} {TEAM2}
get5_hostname_format "Get5: {TEAM1} vs {TEAM2}"

// Timestamp format for generated file names. No spaces, no colons.
get5_time_format "%Y-%m-%d_%H"

// Tag put in front of every get5 chat message.
get5_message_prefix "[{YELLOW}Get5{NORMAL}]"


// ---------------------------------------------------------------------------
// Deliberately not set here
// ---------------------------------------------------------------------------
// Read-only -- the plugin publishes these, setting them does nothing:
//   get5_game_state, get5_last_backup_file, get5_version
//
// Belong to OPTIONAL companion plugins, not core get5. Setting them when the
// plugin is not loaded gives: Unknown command "<name>"
//   get5_web_api_url, get5_web_api_key  (get5_apistats.sp -- the get5-web panel)
//   get5_mysql_force_matchid            (get5_mysqlstats.sp)
// This setup uses local match config files only, so none of them apply.
